syntax = "proto3";

package rollops.v1;

option go_package = "go.klarlabs.de/rollops/internal/grpcapi/rollopsv1;rollopsv1";

// RolloutService is the typed gRPC surface over the engine — the daemon
// transport the CLI and agents use. RPCs map 1:1 to engine operations; the
// browser UI uses the HTTP/JSON surface (internal/api). Every call is
// authenticated (bearer token in the "authorization" metadata by default) and
// authorized via RBAC.
service RolloutService {
  // Plan shows what an apply would change.
  rpc Plan(PlanRequest) returns (PlanResponse);
  // Apply deploys desired state.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Status returns a rollout's current state.
  rpc Status(StatusRequest) returns (StatusResponse);
  // Rollback rolls a target back to its previous desired state.
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  // Approve approves a rollout awaiting approval (and deploys it).
  rpc Approve(RolloutActionRequest) returns (RolloutActionResponse);
  // Reject rejects a rollout awaiting approval.
  rpc Reject(RolloutActionRequest) returns (RolloutActionResponse);
  // Promote marks a verified rollout promoted, gated on the post-deploy checks
  // (health, smoke, metric analysis). Set force to override a failing gate.
  rpc Promote(RolloutActionRequest) returns (RolloutActionResponse);
  // Pause holds an in-flight canary at its current step. Authorized as apply.
  rpc Pause(RolloutActionRequest) returns (RolloutActionResponse);
  // Resume continues an operator-paused canary. Authorized as apply.
  rpc Resume(RolloutActionRequest) returns (RolloutActionResponse);
  // Abort stops an in-flight canary and rolls it back. Authorized as apply.
  rpc Abort(RolloutActionRequest) returns (RolloutActionResponse);
  // Verify DRY-RUNS the post-deploy gate (health, smoke, metric analysis) and
  // reports each one. It changes nothing: no phase transition, no promotion,
  // no rollback. The gates themselves do run — a configured smoke test executes
  // its command on the daemon host.
  rpc Verify(RolloutActionRequest) returns (VerifyResponse);
  // Freeze engages or lifts the emergency kill-switch that blocks all applies.
  rpc Freeze(FreezeRequest) returns (FreezeResponse);
  // FleetStatus aggregates the latest phase per target matching a RolloutSet-style
  // prefix (e.g. "web" or "web@" → web@east, web@west). Authorized as status.
  rpc FleetStatus(FleetStatusRequest) returns (FleetStatusResponse);
}

message PlanRequest {
  // config is the rollout config YAML.
  string config = 1;
}

message PlanResponse {
  string action = 1;   // create | update | noop
  bool changed = 2;
  string summary = 3;
  // Risk fields when spec.risk is configured; zero/false when unconfigured.
  double risk_score = 4;
  bool needs_approval = 5;
  bool sensitive = 6;
  int32 recent_failures = 7; // rolled-back count inside risk.history lookback
  string reason = 8;         // citeable gate explanation for agents
}

message ApplyRequest {
  string config = 1;
}

message ApplyResponse {
  string id = 1;
  string phase = 2;
  string target = 3;
  double risk_score = 4;
}

message StatusRequest {
  string id = 1;
}

message StatusResponse {
  string id = 1;
  string phase = 2;
  string target = 3;
  string strategy = 4;
  // Progressive step progress: the last step that passed its health gate
  // (1-based), the plan's total, and the current traffic weight. All zero
  // when the strategy has not started stepping.
  int32 step_index = 5;
  int32 step_total = 6;
  int32 step_weight = 7;
  string note = 8; // latest transition note (e.g. "database rollback: succeeded")
  double risk_score = 9;
  string actor_kind = 10;
  string actor_name = 11;
}

message RollbackRequest {
  string target = 1;
  // force overrides the backward-compatibility gate: roll back even when the
  // release ran a database migration not declared backwardCompatible and has no
  // reverse command configured.
  bool force = 2;
}

message RollbackResponse {
  string id = 1;
  string phase = 2;
  string target = 3;
}

// RolloutActionRequest identifies a rollout by id for
// approve/reject/promote/verify/pause/resume/abort.
message RolloutActionRequest {
  string id = 1;
  // force applies to Promote only: override the post-deploy gates (health,
  // smoke, metric analysis) and promote anyway. The bypass is audited.
  // Approve/Reject/Verify/Pause/Resume/Abort ignore it.
  bool force = 2;
}

message RolloutActionResponse {
  string id = 1;
  string phase = 2;
  string target = 3;
  string note = 4;
}

// GateResult is one post-deploy gate's outcome in a dry-run verification.
message GateResult {
  // gate is "health", "smoke" or "analysis".
  string gate = 1;
  // status is "pass", "fail", "skipped" (not configured) or "not-run"
  // (short-circuited by an earlier failure).
  string status = 2;
  string detail = 3;
}

// VerifyResponse is the outcome of a dry-run verification. The phase is
// reported, never changed.
message VerifyResponse {
  string id = 1;
  string phase = 2;
  string target = 3;
  // ok is true when no gate failed.
  bool ok = 4;
  // reason is the first failing gate's detail; empty when ok.
  string reason = 5;
  repeated GateResult gates = 6;
}

message FreezeRequest {
  bool active = 1;   // true engages the freeze, false lifts it
  string reason = 2; // recorded when engaging
}

message FreezeResponse {
  bool active = 1;
  string reason = 2;
}

message FleetStatusRequest {
  // filter is a RolloutSet-style set name ("web") or prefix ("web@").
  string filter = 1;
}

message FleetMember {
  string id = 1;
  string target = 2;
  string phase = 3;
}

message FleetStatusResponse {
  string name = 1;
  int32 total = 2;
  int32 promoted = 3;
  int32 active = 4;
  int32 degraded = 5;
  int32 awaiting = 6;
  repeated FleetMember members = 7;
}

