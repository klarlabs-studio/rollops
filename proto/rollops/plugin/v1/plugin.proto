syntax = "proto3";

package rollops.plugin.v1;

option go_package = "go.klarlabs.de/rollops/pkg/plugin/rollopspluginv1;rollopspluginv1";

// Plugin is the single, capability-typed wire every Rollops plugin serves
// (modeled on nox-hq's plugin architecture). A plugin declares what it does via
// a manifest — capabilities grouping named tools, plus the safety scopes it
// needs — and the host invokes tools generically. New plugin kinds (target,
// feature-flag, …) are new capabilities, not new services.
service Plugin {
  // GetManifest returns the plugin's capabilities and safety requirements. The
  // host validates the manifest against its safety policy before any invoke.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);

  // InvokeTool executes a named tool. Input and output are JSON bytes whose
  // shape is defined by the capability the tool belongs to.
  rpc InvokeTool(InvokeToolRequest) returns (InvokeToolResponse);
}

message GetManifestRequest {
  string api_version = 1; // host protocol version, for negotiation
}

message GetManifestResponse {
  string name = 1;
  string version = 2;
  string api_version = 3;
  repeated Capability capabilities = 4;
  SafetyRequirements safety = 5;
}

// Capability groups related tools under a named feature (e.g. "target",
// "featureflag"). The host routes by capability + tool.
message Capability {
  string name = 1;
  string description = 2;
  repeated ToolDef tools = 3;
}

// ToolDef describes one invocable tool.
message ToolDef {
  string name = 1;
  string description = 2;
  bool mutating = 3; // changes external state (vs a read-only probe)
}

// SafetyRequirements declares the scopes a plugin needs. The host rejects a
// plugin whose requirements exceed the active policy.
message SafetyRequirements {
  repeated string network_hosts = 1; // host:port or host the plugin dials
  repeated string file_paths = 2;    // filesystem paths the plugin reads/writes
  repeated string env_vars = 3;      // environment variables the plugin reads
  string risk_class = 4;             // passive | active | invasive
  bool needs_confirmation = 5;       // operator must confirm before invoke
}

message InvokeToolRequest {
  string capability = 1;
  string tool = 2;
  bytes input = 3; // JSON
}

message InvokeToolResponse {
  bytes output = 1; // JSON
}
