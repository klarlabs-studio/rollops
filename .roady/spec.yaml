  - id: execute-steps-through-axi-go-with
    title: Execute steps through axi-go with per-step audit
    description: Execute steps through axi-go with per-step audit.
- id: progressive-delivery
  title: Progressive delivery strategies
  description: Canary, blue-green, and rolling strategies with configurable traffic shifting.
