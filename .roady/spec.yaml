- id: reconcile-drift
  title: Reconciliation & drift handling
  description: 'Reconcile loop: read desired from Git, Observe each target, diff. Drift = desired fingerprint
    != observed. On drift, detect, alert (bolt + notifications), and reconcile, subject to the risk gate.
    Configurable verification depth for dumb targets.'
  requirements:
