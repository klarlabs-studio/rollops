id: rolloffs
title: Rolloffs — Rollout operations for the agentic web
description: Lean, infrastructure-agnostic rollout orchestration where agents and humans are peer operators.
  The engine is a Go library at the center; CLI, daemon, MCP, and UI are thin clients over it. Built on
  the Klarlatz stack (statekit, axi-go, fortify, decision-kit, bolt, mcp-go, mnemos). No Kubernetes dependency
  in core; runs on a bare VPS. v1 risk and rollback are observability-free. Source of desired state is
  Git; the Store holds runtime state only. This spec covers the P0 OSS core.
version: 0.1.0
constraints:
- id: no-k8s-dependency
  description: Core has no Kubernetes dependency. K8s is one target plugin, never an assumption.
- id: observability-free-v1
  description: v1 risk scoring and auto-rollback use no metrics. Metric-based analysis is Phase 2 (Obvia
    seam); do not bake it in.
- id: git-is-desired-truth
  description: Git is the only source of desired state. The Store holds runtime state only; losing it
    must never corrupt what should be deployed.
- id: cel-not-dsl
  description: Conditional logic uses embedded CEL. No bespoke DSL. relicta's governance DSL stays separate.
- id: secrets-never-local
  description: Secrets are never stored locally. Vault via SecretProvider; redact secret material at the
    audit/log/diff/MCP boundary.
- id: every-interface-authenticated
  description: gRPC, REST, and MCP require mTLS or signed tokens. RBAC on operations. The MCP agent surface
    is privileged.
- id: agent-guardrails-hard
  description: Agent limits are hard, not advisory — non-bypassable policy floor, kill-switch, full attribution,
    fortify rate-limit.
- id: lean-single-binary
  description: Single Go binary + SQLite is the common case. First-party targets compiled in. Every feature
    justifies its weight.
- id: build-on-stack
  description: Reuse statekit, axi-go, fortify, decision-kit, bolt, mcp-go, mnemos rather than reinventing.
features:
- id: config-model
  title: Configuration model (YAML + schema + CEL)
  description: YAML surface format fluently written by humans and agents, backed by a strict published
    schema and loud Go-side validation. Embedded CEL for conditional logic (risk conditions, promotion
    criteria, rollback triggers). Schema version field for clean migration.
  requirements:
  - id: define-config-schema-v1-with-a
    title: Define config schema v1 with a version
    description: Define config schema v1 with a version field and publish it.
  - id: go-validation-rejects-malformed-config-loudly
    title: Go validation rejects malformed config loudly (no
    description: Go validation rejects malformed config loudly (no silent typos).
  - id: embed-cel-evaluation-for-risk-promotion
    title: Embed CEL evaluation for risk/promotion/rollback hook points
    description: Embed CEL evaluation for risk/promotion/rollback hook points.
  - id: per-repo-config-at-a-configurable
    title: Per-repo config at a configurable branch +
    description: Per-repo config at a configurable branch + path.
- id: target-contract
  title: Target plugin contract + conformance suite
  description: The public Target interface (Apply/Observe/Health), the manifest/result/ fingerprint/health
    types, and the shared conformance suite every target (first-party or plugin) must pass. Optional gRPC
    plugin escape hatch.
  requirements:
  - id: finalize-the-target-interface-and-supporting
    title: Finalize the Target interface and supporting types
    description: Finalize the Target interface and supporting types (done in scaffold).
  - id: conformance-suite-proving-idempotency-fingerprint-stability
    title: Conformance suite proving idempotency, fingerprint stability, health
    description: Conformance suite proving idempotency, fingerprint stability, health semantics.
  - id: grpc-plugin-protocol-go-plugin-style
    title: gRPC plugin protocol (go-plugin style) with versioning
    description: gRPC plugin protocol (go-plugin style) with versioning.
- id: store-backend
  title: Store interface + SQLite backend
  description: Pluggable persistence for runtime state (rollouts, observed fingerprints, schedules, history).
    SQLite default; Postgres and mnemos later.
  requirements:
  - id: store-interface-done-in-scaffold
    title: Store interface (done in scaffold)
    description: Store interface (done in scaffold).
  - id: sqlite-backend-implementing-the-full-interface
    title: SQLite backend implementing the full interface with
    description: SQLite backend implementing the full interface with migrations.
  - id: crash-safe-persist-statekit-state-per
    title: 'Crash-safe: persist statekit state per transition'
    description: 'Crash-safe: persist statekit state per transition.'
- id: engine-library
  title: Engine library
  description: The central Go package exposing all operations — plan, apply, verify, promote, rollback,
    observe, schedule — transport- and storage-agnostic. Linked directly by both the daemon and the one-shot
    CLI.
  requirements:
  - id: engine-api-surface-covering-all-seven
    title: Engine API surface covering all seven operations
    description: Engine API surface covering all seven operations.
  - id: plan-diff-computed-and-surfaced-before
    title: plan/diff computed and surfaced before any apply
    description: plan/diff computed and surfaced before any apply.
  - id: per-target-advisory-locks-per-repo
    title: Per-target advisory locks; per-repo reconcile serialization
    description: Per-target advisory locks; per-repo reconcile serialization.
- id: rollout-lifecycle
  title: Rollout lifecycle (statekit)
  description: 'Each rollout is a statekit statechart: pending → validating → [risk gate] → deploying
    → verifying → promoted / rolled-back / awaiting-approval. Durable, inspectable, persisted per transition.'
  requirements:
  - id: model-the-statechart-in-statekit-with
    title: Model the statechart in statekit with all
    description: Model the statechart in statekit with all phases and transitions.
  - id: validating-runs-schema-cel-validation-dependency
    title: validating runs schema+CEL validation, dependency resolution, plan/diff
    description: validating runs schema+CEL validation, dependency resolution, plan/diff.
  - id: agent-driven-apply-requires-the-plan
    title: Agent-driven apply requires the plan to have
    description: Agent-driven apply requires the plan to have been produced first.
- id: risk-gate
  title: Risk-based approval gate (decision-kit)
  description: 'decision-kit scores blast radius from five observability-free signals: target criticality,
    environment, change type, blast radius, rollout strategy. Below threshold auto-proceeds; above/sensitive
    needs a single human approval. CEL-configurable.'
  requirements:
  - id: compute-the-five-signal-weighted-score
    title: Compute the five-signal weighted score via decision-kit
    description: Compute the five-signal weighted score via decision-kit.
  - id: cel-configurable-threshold-and-gate-conditions
    title: CEL-configurable threshold and gate conditions
    description: CEL-configurable threshold and gate conditions.
  - id: single-approval-gate-approve-reject-block
    title: Single approval gate (approve / reject /
    description: Single approval gate (approve / reject / block); no multi-stage chains.
- id: step-execution
  title: Step execution (axi-go + fortify)
  description: Every target operation runs through axi-go (sandboxed, auditable) and is wrapped in fortify
    (retry, circuit breaker, rate limit, bulkhead).
