apiVersion: rollops.klarlabs.de/v1
kind: RolloutConfig
metadata:
  name: dogfood
spec:
  target:
    kind: kubernetes
    ref: dogfood/prod/web
    criticality: medium
    spec:
      context: minikube
      namespace: rollops-dogfood
      resource: deployment/web
      manifest: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: web
          namespace: rollops-dogfood
        spec:
          replicas: 1
          selector:
            matchLabels: {app: web}
          template:
            metadata:
              labels: {app: web}
            spec:
              containers:
                - name: pause
                  image: registry.k8s.io/pause:3.9
  strategy:
    type: rolling
