# Rollops deploys rollops.
#
# Every release bumps the image pinned in deploy/kubernetes/rollopsd-deployment.yaml,
# and until this config existed nothing applied that bump: the daemon ran v0.34.3
# while the repository said v0.34.8, four releases of rollout fixes that were
# never in force. A client is only as correct as the daemon executing its
# rollouts, so the daemon follows its own releases like any other workload.
#
# Add this repository to ROLLOPS_WATCH with path "rollops.yaml" for it to take
# effect (see deploy/kubernetes/rollopsd-watch.example.yaml).
#
# This file sits at the repository root on purpose. A referenced manifest path
# is resolved against the repo checkout root by the daemon and against the
# config file's own directory by the CLI, and `..` is refused — so only a
# config at the root reads the same way to both. In deploy/ the daemon looked
# for deploy/kubernetes/rollopsd-deployment.yaml at the repo root and refused
# the batch.
apiVersion: rollops.klarlabs.de/v1
kind: RolloutConfig
metadata:
  name: rollopsd
spec:
  target:
    kind: kubernetes
    ref: rollops/prod/rollopsd
    criticality: high
    spec:
      # No `context`: the daemon applies this from inside the cluster with its
      # ServiceAccount, where kubeconfig contexts do not exist. Naming one is
      # how this refused its first real reconcile:
      #   kubectl apply --dry-run=server: context "felixgeelhaar" does not exist
      namespace: rollops-system
      resource: deployment/rollopsd
      # The tracked image. imagePolicy bumps this line, and it overrides the
      # container image in the rendered manifest.
      image: ghcr.io/klarlabs-studio/rollopsd:v0.34.11
      # The Deployment alone. The namespace, cert-manager issuers, RBAC, PVC and
      # Service are bootstrap (rollopsd-infra.yaml) and are applied by a human:
      # the daemon's ServiceAccount cannot get cert-manager ClusterIssuers, and
      # must never be able to rewrite its own ClusterRole. Pointing this at the
      # full manifest is how the first self-managed apply was refused —
      #   clusterissuers.cert-manager.io "rollopsd-selfsigned" is forbidden
      # — with nothing applied, which is the preflight working as intended.
      manifestFrom:
        path: deploy/kubernetes/rollopsd-deployment.yaml

  # Recreate, single replica, one writer to the sqlite PVC: there is no canary
  # to run. The daemon applies this, exits with the old pod, and the new one
  # picks the rollout up from the database and finishes it.
  strategy:
    type: rolling

  # Follow releases automatically, one minor line at a time. The release tag
  # publishes ghcr.io/klarlabs-studio/rollopsd:vX.Y.Z; this notices it, opens a
  # PR against this file (main is protected), and the merge deploys it.
  imagePolicy:
    mode: minor
    pattern: '^v\d+\.\d+\.\d+$'
    allowMutableTags: false
    writeback: pull-request

  rollback:
    auto: true

  verification: detect
