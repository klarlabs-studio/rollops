# Docker base-image digests ONLY. Everything else moved to nox.
#
# nox is this org's dependency and supply-chain gate (see nox-remediate.yml), and
# it genuinely replaces two of the three ecosystems this file used to carry:
#
#   gomod          -> `nox fix` upgrades OSV-vulnerable go packages
#   github-actions -> `nox fix --actions` bumps outdated pins AND SHA-pins
#                     mutable tag refs, which is the same job with a stricter
#                     result
#
# It does NOT replace the docker updater, and that is not an oversight in nox —
# it is the shape of the problem. Nox has rules that push you toward pinning a
# base image by digest (CONT-001 "base image not pinned to specific digest",
# CONT-002, IAC-002), and none that notice the pin has since gone stale. Pinning
# is what freezes `FROM ...@sha256:...` at whatever was current the day it was
# written, unpatched CVEs included. Something has to move it, and nox has no
# remediation path that does.
#
# Dependabot rather than Renovate, still deliberately: Renovate is the better
# digest tool but needs its GitHub App installed on the organization, so a
# committed renovate.json would sit inert while the pins looked maintained.
#
# Note the trade this makes on Go: nox upgrades packages that are
# OSV-VULNERABLE, where dependabot's gomod group did routine minor/patch bumps
# regardless. Routine freshness is what we give up; security coverage is not.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
