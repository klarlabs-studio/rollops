# Thin caller for the shared klarlabs-studio Go CI bar.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    # No paths-ignore on PRs: the required checks (ci / Test|Build|Lint|Security)
    # are branch-protection gates, so a docs-only PR that skipped them would be
    # permanently BLOCKED (never mergeable without an admin override). Running
    # CI on docs PRs is cheap (~1.5m, all-green with no code change) and keeps
    # every PR mergeable. push-to-main keeps its paths-ignore below.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      # Enabled now that .coverctl.yaml exists. The shared bar runs the suite either
      # way; this input controls only the `coverctl check` gate, and its own
      # description explains the previous value: "set false for repos without a
      # threshold yet". There is a threshold now.
      coverage: true
