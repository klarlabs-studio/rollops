name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for the changelog/version

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      # The embedded UI bundle is committed; fail the release if it is stale so
      # we never ship a binary whose console doesn't match source.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: verify UI bundle is current
        run: |
          (cd internal/ui/web && npm ci && npm run build)
          if ! git diff --quiet -- internal/ui/assets; then
            echo "internal/ui/assets is stale — run 'make ui-build' and commit"; exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push the rollopsd container image for every tag, so the deploy
  # manifest's pin (ghcr.io/.../rollopsd:vX.Y.Z) actually resolves. goreleaser
  # above ships binaries + the GitHub release; this ships the image.
  image:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Prefer CR_PAT (a PAT with write:packages) — GITHUB_TOKEN cannot push to a
      # ghcr package that isn't linked to this repo (manually-created packages
      # aren't), failing with `denied: permission_denied: write_package`. Add a
      # CR_PAT secret to make releases self-serve; falls back to GITHUB_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/klarlabs-studio/rollopsd
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only for now: the Dockerfile hard-codes the amd64 kubectl URL,
          # so an arm64 image would carry the wrong kubectl. Make kubectl's arch
          # TARGETARCH-driven before enabling linux/arm64 here.
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
