name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # full history + tags for the changelog/version

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      # The embedded UI bundle is committed; fail the release if it is stale so
      # we never ship a binary whose console doesn't match source.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: verify UI bundle is current
        run: |
          (cd internal/ui/web && npm ci && npm run build)
          if ! git diff --quiet -- internal/ui/assets; then
            echo "internal/ui/assets is stale — run 'make ui-build' and commit"; exit 1
          fi

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push the rollopsd container image for every tag, so the deploy
  # manifest's pin (ghcr.io/.../rollopsd:vX.Y.Z) actually resolves. goreleaser
  # above ships binaries + the GitHub release; this ships the image.
  image:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Prefer CR_PAT (a PAT with write:packages) — GITHUB_TOKEN cannot push to a
      # ghcr package that isn't linked to this repo (manually-created packages
      # aren't), failing with `denied: permission_denied: write_package`. Add a
      # CR_PAT secret to make releases self-serve; falls back to GITHUB_TOKEN.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/klarlabs-studio/rollopsd
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # amd64 only for now: the Dockerfile hard-codes the amd64 kubectl URL,
          # so an arm64 image would carry the wrong kubectl. Make kubectl's arch
          # TARGETARCH-driven before enabling linux/arm64 here.
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
