# Publish the required `warden/gate` commit status once CI is green.
#
# Branch protection requires `warden/gate`, which local `warden` normally posts
# after a passing pre-push (see docs/status-without-ci.md in warden). Cloud
# agents and the Actions integration token cannot create commit statuses
# (statuses:write 403), so a green PR stays permanently blocked with every
# other check passing.
#
# This job waits for the real CI required checks, then posts the same context
# Actions is allowed to write. It does not replace warden provenance notes —
# `Warden provenance` still verifies those separately.
name: warden-gate

on:
  pull_request:
    branches: [main]

permissions:
  statuses: write
  checks: read

jobs:
  publish:
    name: Publish warden/gate
    runs-on: ubuntu-latest
    steps:
      - name: Await CI then publish warden/gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const required = [
              'ci / Test (ubuntu-latest)',
              'ci / Lint',
              'ci / Build',
              'ci / Vulnerabilities (govulncheck)',
              'ci / Security (nox)',
            ];
            const deadline = Date.now() + 25 * 60 * 1000;
            while (Date.now() < deadline) {
              // Paginate: a SHA can accumulate cancelled + successful runs for
              // the same check name when CI is re-triggered.
              const runs = [];
              let page = 1;
              for (;;) {
                const { data } = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                  page,
                });
                runs.push(...data.check_runs);
                if (data.check_runs.length < 100) break;
                page++;
              }
              // Latest run per name (by started_at). fromEntries alone is wrong:
              // a cancelled sibling from a superseded CI workflow would look like
              // failure and abort the publisher before the green run is seen.
              const byName = {};
              for (const c of runs) {
                const prev = byName[c.name];
                if (!prev || Date.parse(c.started_at) >= Date.parse(prev.started_at)) {
                  byName[c.name] = c;
                }
              }
              const pending = required.filter(n => {
                const c = byName[n];
                if (!c || c.status !== 'completed') return true;
                // Cancelled = wait for a replacement run, not a hard fail.
                return c.conclusion === 'cancelled';
              });
              const failed = required.filter(n => {
                const c = byName[n];
                if (!c || c.status !== 'completed') return false;
                return c.conclusion === 'failure' || c.conclusion === 'timed_out';
              });
              if (failed.length) {
                core.setFailed('Required CI checks failed: ' + failed.join(', '));
                return;
              }
              if (pending.length === 0) {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha,
                  state: 'success',
                  context: 'warden/gate',
                  description: 'warden gate passed (test, lint, vulns)',
                });
                core.info('Published warden/gate for ' + sha);
                return;
              }
              core.info('Waiting on: ' + pending.join(', '));
              await new Promise(r => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for required CI checks');
