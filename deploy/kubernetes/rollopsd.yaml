# In-cluster rollopsd: the long-lived daemon that reconciles watched Git repos,
# serves the UI/REST API, and drives rollouts on the cluster through its
# ServiceAccount. Secrets (admin token, UI password, image pull) are created out
# of band — see docs/deploy-kubernetes.md.
apiVersion: v1
kind: Namespace
metadata:
  name: rollops-system
---
# --- TLS (cert-manager) -----------------------------------------------------
# rollopsd terminates TLS 1.3 itself on :8443 and requires mTLS on the machine
# control plane (REST API / gRPC / MCP). These two objects issue the server cert
# into the `rollopsd-tls` Secret; the same Secret's `ca.crt` is mounted as the
# client-CA bundle so agents/CLIs presenting a cert from this CA are accepted.
#
# PREREQUISITE: cert-manager must be installed
# (https://cert-manager.io/docs/installation/). Without it the Issuer and
# Certificate below are inert (no rollopsd-tls Secret is created) and the
# Deployment will not start — the TLS volume mount stays unsatisfied. In that
# case either install cert-manager, provide your own `rollopsd-tls` Secret
# (keys: tls.crt, tls.key, ca.crt), OR use the mesh alternative: bind loopback
# (ROLLOPS_ADDR=127.0.0.1:8080, drop the TLS env + volume + this whole block)
# and let a sidecar mesh (Istio/Linkerd) provide mTLS at the network boundary.
#
# SWAP FOR YOUR REAL CA: this self-signed ClusterIssuer is a working default so
# the manifest applies stand-alone. In production point the Certificate's
# issuerRef at your real CA — Let's Encrypt (ACME), Vault, or an intermediate CA
# Issuer — so client and server certs chain to a trust root you control.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rollopsd-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rollopsd-tls
  namespace: rollops-system
spec:
  secretName: rollopsd-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d — cert-manager rotates the Secret; rollopsd hot-reloads it
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  # In-cluster DNS SANs so peers verify the server by its Service name.
  dnsNames:
    - rollopsd.rollops-system.svc
    - rollopsd.rollops-system.svc.cluster.local
  issuerRef:
    name: rollopsd-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollopsd
  namespace: rollops-system
imagePullSecrets:
  - name: ghcr
---
# rollopsd applies/observes workloads and patches routers across the namespaces
# its rollouts target. Cluster-scoped for simplicity; narrow to a Role per
# target namespace in stricter setups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollopsd
rules:
  - apiGroups: [""]
    resources: [namespaces, services, pods, configmaps]
    verbs: [get, list, watch, create, update, patch]
  # PVCs are managed but never deleted by the reconciler (no `delete` verb) —
  # deleting a bound PVC would destroy data.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, update, patch]
  # Classic Ingress (alongside Gateway API httproutes above).
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # Read CRDs and their instances for status.conditions health assessment.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollopsd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollopsd
subjects:
  - kind: ServiceAccount
    name: rollopsd
    namespace: rollops-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rollopsd-watch
  namespace: rollops-system
data:
  # Repos rollopsd reconciles. Best practice: each app's Rollops config lives in
  # that app's own repo under `.rollops/` (config beside code, one PR per change,
  # image-automation bumps push back there). `path` is the directory; a directory
  # loads every *.yaml.
  #
  # Per-repo least-privilege auth, in order of preference:
  #   - githubApp* : mint short-lived, auto-rotating installation tokens scoped
  #     to that installation's repos (works across orgs + personal accounts via
  #     separate installations). Best for a daemon that writes bumps to many repos.
  #   - deployKeyPath : per-repo SSH key (git+ssh url), naturally single-repo.
  #   - tokenFile / token : a (broad) PAT. Simplest, least scoped — avoid sharing
  #     one across repos/orgs.
  watch.json: |
    [
      {
        "name": "armada",
        "url": "https://github.com/klarlabs-studio/armada",
        "branch": "main",
        "path": ".rollops",
        "githubAppId": "123456",
        "githubInstallationId": "78901234",
        "githubAppPrivateKeyFile": "/etc/rollops/git/armada-app.pem"
      },
      {
        "name": "vorhut",
        "url": "https://github.com/klarlabs-studio/vorhut",
        "branch": "main",
        "path": ".rollops",
        "tokenFile": "/etc/rollops/git/token"
      }
    ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rollopsd-data
  namespace: rollops-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollopsd
  namespace: rollops-system
  labels: { app: rollopsd }
spec:
  replicas: 1
  strategy: { type: Recreate } # single writer to the sqlite PVC
  selector: { matchLabels: { app: rollopsd } }
  template:
    metadata: { labels: { app: rollopsd } }
    spec:
      serviceAccountName: rollopsd
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: rollopsd
          image: ghcr.io/klarlabs-studio/rollopsd:v0.21.0
          args: []
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: ROLLOPS_DB, value: /var/lib/rollops/rollops.db }
            - { name: ROLLOPS_ADDR, value: ":8443" }
            # Native TLS 1.3 on the pod. rollopsd refuses a non-loopback bind
            # without these. The cert Secret (rollopsd-tls, issued above) is
            # mounted read-only; cert-manager rotates it in place and rollopsd
            # hot-reloads the new keypair without a restart.
            - { name: ROLLOPS_TLS_CERT, value: /etc/rollops/tls/tls.crt }
            - { name: ROLLOPS_TLS_KEY, value: /etc/rollops/tls/tls.key }
            # Client-CA bundle → mTLS on the machine control plane (REST API,
            # gRPC, MCP). The browser UI still connects with server TLS + OIDC/
            # session auth only. Remove to run server-TLS-only (no mTLS).
            - { name: ROLLOPS_TLS_CLIENT_CA, value: /etc/rollops/tls/ca.crt }
            - { name: ROLLOPS_WATCH, value: /etc/rollops/watch.json }
            - { name: ROLLOPS_RECONCILE_INTERVAL, value: "60s" }
            - name: ROLLOPS_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: rollopsd-secrets, key: admin-token } }
            - name: ROLLOPS_UI_PASSWORD
              valueFrom: { secretKeyRef: { name: rollopsd-secrets, key: ui-password } }
            # Registry-poll image automation. Optional secrets so the daemon
            # still starts without them (automation/private repos just disabled).
            - { name: ROLLOPS_IMAGE_AUTOMATION, value: "1" }
            - name: ROLLOPS_REGISTRY_USER
              valueFrom: { secretKeyRef: { name: rollopsd-registry, key: user, optional: true } }
            - name: ROLLOPS_REGISTRY_TOKEN
              valueFrom: { secretKeyRef: { name: rollopsd-registry, key: token, optional: true } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rollops }
            - { name: watch, mountPath: /etc/rollops, readOnly: true }
            # Server keypair + client-CA bundle (tls.crt, tls.key, ca.crt).
            - { name: tls, mountPath: /etc/rollops/tls, readOnly: true }
            # Git credentials for private config repos: GitHub App private key(s),
            # deploy keys, and/or a token — referenced by path in watch.json.
            - { name: git, mountPath: /etc/rollops/git, readOnly: true }
          # /readyz is unauthenticated and needs no client cert, but the listener
          # is HTTPS — probe over TLS on 8443.
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rollopsd-data }
        - name: watch
          configMap: { name: rollopsd-watch }
        - name: tls
          secret: { secretName: rollopsd-tls }
        - name: git
          secret: { secretName: rollopsd-git, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: rollopsd
  namespace: rollops-system
spec:
  selector: { app: rollopsd }
  ports:
    - { name: https, port: 443, targetPort: https }
