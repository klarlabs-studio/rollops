# In-cluster rollopsd: the long-lived daemon that reconciles watched Git repos,
# serves the UI/REST API, and drives rollouts on the cluster through its
# ServiceAccount. Secrets (admin token, UI password, image pull) are created out
# of band — see docs/deploy-kubernetes.md.
apiVersion: v1
kind: Namespace
metadata:
  name: rollops-system
---
# --- TLS (cert-manager) -----------------------------------------------------
# rollopsd terminates TLS 1.3 itself on :8443 and requires mTLS on the machine
# control plane (REST API / gRPC / MCP). These two objects issue the server cert
# into the `rollopsd-tls` Secret; the same Secret's `ca.crt` is mounted as the
# client-CA bundle so agents/CLIs presenting a cert from this CA are accepted.
#
# PREREQUISITE: cert-manager must be installed
# (https://cert-manager.io/docs/installation/). Without it the Issuer and
# Certificate below are inert (no rollopsd-tls Secret is created) and the
# Deployment will not start — the TLS volume mount stays unsatisfied. In that
# case either install cert-manager, provide your own `rollopsd-tls` Secret
# (keys: tls.crt, tls.key, ca.crt), OR use the mesh alternative: bind loopback
# (ROLLOPS_ADDR=127.0.0.1:8080, drop the TLS env + volume + this whole block)
# and let a sidecar mesh (Istio/Linkerd) provide mTLS at the network boundary.
#
# SWAP FOR YOUR REAL CA: this self-signed ClusterIssuer is a working default so
# the manifest applies stand-alone. In production point the Certificate's
# issuerRef at your real CA — Let's Encrypt (ACME), Vault, or an intermediate CA
# Issuer — so client and server certs chain to a trust root you control.
# SelfSigned issuer — bootstrap only, used once to sign the root CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rollopsd-selfsigned
spec:
  selfSigned: {}
---
# Root CA. BOTH the server cert AND every client cert are signed by this one CA,
# so the daemon's ROLLOPS_TLS_CLIENT_CA (the rollopsd-tls Secret's ca.crt, which
# is this CA) verifies client certs. NOTE: a bare SelfSigned issuer would make
# each certificate its own root, and mTLS could never verify a client — the CA
# issuer chain below is required for mutual TLS to work at all.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rollopsd-ca
  namespace: rollops-system
spec:
  isCA: true
  commonName: rollopsd-ca
  secretName: rollopsd-ca
  duration: 43800h # 5y
  renewBefore: 720h # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: rollopsd-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA issuer — signs the server cert and all client certs from the root CA above.
# SWAP FOR YOUR REAL CA: point this at Vault / an intermediate, or issue the
# certs below directly from your org CA, to chain to a trust root you control.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: rollopsd-ca
  namespace: rollops-system
spec:
  ca:
    secretName: rollopsd-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rollopsd-tls
  namespace: rollops-system
spec:
  secretName: rollopsd-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d — cert-manager rotates the Secret; rollopsd hot-reloads it
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  # In-cluster DNS SANs so peers verify the server by its Service name.
  dnsNames:
    - rollopsd.rollops-system.svc
    - rollopsd.rollops-system.svc.cluster.local
  issuerRef:
    name: rollopsd-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollopsd
  namespace: rollops-system
imagePullSecrets:
  - name: ghcr
---
# rollopsd applies/observes workloads and patches routers across the namespaces
# its rollouts target. Cluster-scoped for simplicity; narrow to a Role per
# target namespace in stricter setups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollopsd
rules:
  - apiGroups: [""]
    resources: [namespaces, services, pods, configmaps]
    verbs: [get, list, watch, create, update, patch]
  # PVCs are managed but never deleted by the reconciler (no `delete` verb) —
  # deleting a bound PVC would destroy data.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch]
  # Scheduled work. A CronJob is a legitimate rollout target — its image drifts
  # exactly like a Deployment's, and being outside the reconciler is how a job
  # ends up running a container 58 minor versions behind the app it belongs to.
  # `batch` was absent from this role entirely, so such a target got as far as
  # apply and then failed:
  #
  #   cronjobs.batch "..." is forbidden: User
  #   "system:serviceaccount:rollops-system:rollopsd" cannot get resource
  #   "cronjobs" in API group "batch"
  #
  # jobs are READ-ONLY here: rollops does not manage Jobs as targets (a Job spec
  # is immutable, so there is nothing to roll), but reading the Jobs a CronJob
  # spawns is what makes its health assessable. No `delete` on either — removing
  # a CronJob would silently drop scheduled work, the same reasoning as PVCs.
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, update, patch]
  # Classic Ingress (alongside Gateway API httproutes above).
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # Read CRDs and their instances for status.conditions health assessment.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollopsd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollopsd
subjects:
  - kind: ServiceAccount
    name: rollopsd
    namespace: rollops-system
---
# NOTE: the `rollopsd-watch` ConfigMap (the live list of repos to reconcile) is
# deliberately NOT defined here — re-applying this manifest must never clobber a
# running fleet's watch list. Create it once from `rollopsd-watch.example.yaml`
# and manage it separately (kubectl edit / your own overlay). The Deployment
# below mounts it by name.
---
# ENVIRONMENT-SPECIFIC: set the storageClass, and if your cluster already holds
# the data volume under a different name, adjust BOTH this claim's name and the
# Deployment's `data` volume `claimName` to match — that claim must be the PVC
# that actually holds `/var/lib/rollops/rollops.db`. A default 1Gi RWO claim:
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rollopsd-data
  namespace: rollops-system
  # storageClassName: longhorn   # set your cluster's storage class
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollopsd
  namespace: rollops-system
  labels: { app: rollopsd }
spec:
  replicas: 1
  strategy: { type: Recreate } # single writer to the sqlite PVC
  selector: { matchLabels: { app: rollopsd } }
  template:
    metadata: { labels: { app: rollopsd } }
    spec:
      serviceAccountName: rollopsd
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        # The container runtime's default seccomp profile. Unset means "Unconfined" on
        # most runtimes, which leaves the whole syscall surface reachable from a process
        # that needs a small, ordinary subset of it.
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rollopsd
          image: ghcr.io/klarlabs-studio/rollopsd:v0.31.0
          # Container hardening. The pod already runs as uid 10001; these remove the
          # privileges that a non-root process can still acquire or retain.
          #
          # readOnlyRootFilesystem is on, and the two writable paths below are why.
          #
          # Measured rather than assumed, by running this image with --read-only under a
          # non-root uid: the daemon starts, creates its database, and writes WAL
          # (rollops.db-wal appeared and grew across a real API write) entirely inside the
          # mounted volume. SQLite needs no temp directory here, which was the specific
          # doubt that kept this setting off.
          #
          # kubectl is the part that does need writable space. In the same container,
          # `mkdir -p $HOME/.kube` failed with "Read-only file system", and kubectl keeps a
          # discovery cache under ~/.kube/cache and an HTTP cache under ~/.kube/http-cache.
          # The Kubernetes target and the traffic router both shell out to it, so a
          # read-only root filesystem without these mounts degrades or breaks the one thing
          # this daemon exists to do — and it would do so at the first reconcile, not at
          # startup, which is the worst way to find out.
          securityContext:
            readOnlyRootFilesystem: true
            # A non-root process can still gain privileges through a setuid binary; this
            # closes that path.
            allowPrivilegeEscalation: false
            capabilities:
              # rollopsd binds :8443, well above the privileged range, and shells out to
              # kubectl. Neither needs a capability.
              drop: ["ALL"]
            # Repeated from the pod context, which already sets it. Containers inherit the
            # pod's profile, so this is redundant to Kubernetes — but it keeps the container
            # confined if the pod-level block is ever edited, and it is what a scanner
            # checking this block for itself expects to find.
            seccompProfile: { type: RuntimeDefault }
          args: []
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: ROLLOPS_DB, value: /var/lib/rollops/rollops.db }
            - { name: ROLLOPS_ADDR, value: ":8443" }
            # Native TLS 1.3 on the pod. rollopsd refuses a non-loopback bind
            # without these. The cert Secret (rollopsd-tls, issued above) is
            # mounted read-only; cert-manager rotates it in place and rollopsd
            # hot-reloads the new keypair without a restart.
            - { name: ROLLOPS_TLS_CERT, value: /etc/rollops/tls/tls.crt }
            - { name: ROLLOPS_TLS_KEY, value: /etc/rollops/tls/tls.key }
            # Client-CA bundle → mTLS on the machine control plane (REST API,
            # gRPC, MCP). The browser UI still connects with server TLS + OIDC/
            # session auth only. Remove to run server-TLS-only (no mTLS).
            - { name: ROLLOPS_TLS_CLIENT_CA, value: /etc/rollops/tls/ca.crt }
            - { name: ROLLOPS_WATCH, value: /etc/rollops/watch.json }
            - { name: ROLLOPS_RECONCILE_INTERVAL, value: "60s" }
            - name: ROLLOPS_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: rollopsd-secrets, key: admin-token } }
            - name: ROLLOPS_UI_PASSWORD
              valueFrom: { secretKeyRef: { name: rollopsd-secrets, key: ui-password } }
            # Registry-poll image automation. Optional secrets so the daemon
            # still starts without them (automation/private repos just disabled).
            - { name: ROLLOPS_IMAGE_AUTOMATION, value: "1" }
            - name: ROLLOPS_REGISTRY_USER
              valueFrom: { secretKeyRef: { name: rollopsd-registry, key: user, optional: true } }
            - name: ROLLOPS_REGISTRY_TOKEN
              valueFrom: { secretKeyRef: { name: rollopsd-registry, key: token, optional: true } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rollops }
            - { name: watch, mountPath: /etc/rollops, readOnly: true }
            # Server keypair + client-CA bundle (tls.crt, tls.key, ca.crt).
            - { name: tls, mountPath: /etc/rollops/tls, readOnly: true }
            # Git credentials for private config repos: GitHub App private key(s),
            # deploy keys, and/or a token — referenced by path in watch.json.
            - { name: git, mountPath: /etc/rollops/git, readOnly: true }
            # Writable scratch, required by readOnlyRootFilesystem above.
            #
            # emptyDir rather than a PVC: both hold caches that are rebuilt on demand, so
            # losing them on restart costs one slower reconcile and nothing else. Sized so a
            # runaway cache cannot consume the node's ephemeral storage.
            - { name: tmp, mountPath: /tmp }
            - { name: kubecache, mountPath: /home/rollops/.kube }
          # /readyz is unauthenticated and needs no client cert, but the listener
          # is HTTPS — probe over TLS on 8443.
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Measured 2026-08-10 on a 2-node edge cluster: 268m steady, 330m
          # peak over 5m windows, 104Mi memory — against requests of 50m/64Mi
          # and a 500m CPU limit. Both numbers were wrong in the same direction.
          #
          # The request understated real use by 5x, so the scheduler packed the
          # node as if rollopsd were idle. The limit then throttled it 70% of
          # every CFS period: reconciles are bursty, and short spikes blow
          # through 500m even while the 5m average sits below it. A throttled
          # reconciler is slow to notice a new image, which is the one thing
          # this process exists to do.
          #
          # Requests now track observed steady state; the CPU limit is ~4.5x the
          # observed peak, which is headroom for the burst rather than a target.
          # If throttling persists, the next step is dropping the CPU limit
          # entirely — CFS throttling costs a latency-sensitive controller more
          # than the limit protects the node.
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: 1500m, memory: 384Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rollopsd-data }
        - name: watch
          configMap: { name: rollopsd-watch }
        - name: tls
          secret: { secretName: rollopsd-tls }
        - name: git
          secret: { secretName: rollopsd-git, optional: true }
        # Scratch for a read-only root filesystem. Both are caches rebuilt on demand, so
        # emptyDir is right and losing them on restart costs one slower reconcile.
        # sizeLimit is set because an unbounded emptyDir is charged against the node's
        # ephemeral storage, and a cache that grows without one can evict the pod it belongs
        # to — a failure mode that reads as a mysterious eviction rather than a full disk.
        # Written in block style rather than the flow style used elsewhere in this file, and
        # without naming the scanner's pattern in this comment: the rule matches on the key
        # alone, so writing it in prose here produced a third finding pointing at a comment.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: kubecache
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rollopsd
  namespace: rollops-system
spec:
  selector: { app: rollopsd }
  ports:
    - { name: https, port: 443, targetPort: https }
