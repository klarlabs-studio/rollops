# In-cluster rollopsd — WORKLOAD. The long-lived daemon that reconciles watched
# Git repos, serves the UI/REST API, and drives rollouts on the cluster through
# its ServiceAccount.
#
# This file is SELF-MANAGED: `rollops.yaml` at the repo root tracks the image
# below and renders this manifest onto rollops-system/deployment/rollopsd, so a
# release bump here is deployed by the running daemon. Keep it to the Deployment
# alone — the namespace, TLS material, RBAC, PVC and Service are bootstrap and
# live in rollopsd-infra.yaml, which the daemon has no business rewriting.
#
# It is still an ordinary manifest: on a first install apply it by hand together
# with rollopsd-infra.yaml (see docs/deploy-kubernetes.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollopsd
  namespace: rollops-system
  labels: { app: rollopsd }
spec:
  replicas: 1
  strategy: { type: Recreate } # single writer to the sqlite PVC
  selector: { matchLabels: { app: rollopsd } }
  template:
    metadata: { labels: { app: rollopsd } }
    spec:
      serviceAccountName: rollopsd
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        # The container runtime's default seccomp profile. Unset means "Unconfined" on
        # most runtimes, which leaves the whole syscall surface reachable from a process
        # that needs a small, ordinary subset of it.
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rollopsd
          image: ghcr.io/klarlabs-studio/rollopsd:v0.34.9
          # Container hardening. The pod already runs as uid 10001; these remove the
          # privileges that a non-root process can still acquire or retain.
          #
          # readOnlyRootFilesystem is on, and the two writable paths below are why.
          #
          # Measured rather than assumed, by running this image with --read-only under a
          # non-root uid: the daemon starts, creates its database, and writes WAL
          # (rollops.db-wal appeared and grew across a real API write) entirely inside the
          # mounted volume. SQLite needs no temp directory here, which was the specific
          # doubt that kept this setting off.
          #
          # kubectl is the part that does need writable space. In the same container,
          # `mkdir -p $HOME/.kube` failed with "Read-only file system", and kubectl keeps a
          # discovery cache under ~/.kube/cache and an HTTP cache under ~/.kube/http-cache.
          # The Kubernetes target and the traffic router both shell out to it, so a
          # read-only root filesystem without these mounts degrades or breaks the one thing
          # this daemon exists to do — and it would do so at the first reconcile, not at
          # startup, which is the worst way to find out.
          securityContext:
            readOnlyRootFilesystem: true
            # A non-root process can still gain privileges through a setuid binary; this
            # closes that path.
            allowPrivilegeEscalation: false
            capabilities:
              # rollopsd binds :8443, well above the privileged range, and shells out to
              # kubectl. Neither needs a capability.
              drop: ["ALL"]
            # Repeated from the pod context, which already sets it. Containers inherit the
            # pod's profile, so this is redundant to Kubernetes — but it keeps the container
            # confined if the pod-level block is ever edited, and it is what a scanner
            # checking this block for itself expects to find.
            seccompProfile: { type: RuntimeDefault }
          args: []
          ports:
            - { name: https, containerPort: 8443 }
          env:
            - { name: ROLLOPS_DB, value: /var/lib/rollops/rollops.db }
            - { name: ROLLOPS_ADDR, value: ":8443" }
            # Native TLS 1.3 on the pod. rollopsd refuses a non-loopback bind
            # without these. The cert Secret (rollopsd-tls, issued above) is
            # mounted read-only; cert-manager rotates it in place and rollopsd
            # hot-reloads the new keypair without a restart.
            - { name: ROLLOPS_TLS_CERT, value: /etc/rollops/tls/tls.crt }
            - { name: ROLLOPS_TLS_KEY, value: /etc/rollops/tls/tls.key }
            # Client-CA bundle → mTLS on the machine control plane (REST API,
            # gRPC, MCP). The browser UI still connects with server TLS + OIDC/
            # session auth only. Remove to run server-TLS-only (no mTLS).
            - { name: ROLLOPS_TLS_CLIENT_CA, value: /etc/rollops/tls/ca.crt }
            - { name: ROLLOPS_WATCH, value: /etc/rollops/watch.json }
            - { name: ROLLOPS_RECONCILE_INTERVAL, value: "60s" }
            - name: ROLLOPS_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: rollopsd-secrets, key: admin-token } }
            - name: ROLLOPS_UI_PASSWORD
              valueFrom: { secretKeyRef: { name: rollopsd-secrets, key: ui-password } }
            # Registry-poll image automation. Optional secrets so the daemon
            # still starts without them (automation/private repos just disabled).
            - { name: ROLLOPS_IMAGE_AUTOMATION, value: "1" }
            - name: ROLLOPS_REGISTRY_USER
              valueFrom: { secretKeyRef: { name: rollopsd-registry, key: user, optional: true } }
            - name: ROLLOPS_REGISTRY_TOKEN
              valueFrom: { secretKeyRef: { name: rollopsd-registry, key: token, optional: true } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rollops }
            - { name: watch, mountPath: /etc/rollops, readOnly: true }
            # Server keypair + client-CA bundle (tls.crt, tls.key, ca.crt).
            - { name: tls, mountPath: /etc/rollops/tls, readOnly: true }
            # Git credentials for private config repos: GitHub App private key(s),
            # deploy keys, and/or a token — referenced by path in watch.json.
            - { name: git, mountPath: /etc/rollops/git, readOnly: true }
            # Writable scratch, required by readOnlyRootFilesystem above.
            #
            # emptyDir rather than a PVC: both hold caches that are rebuilt on demand, so
            # losing them on restart costs one slower reconcile and nothing else. Sized so a
            # runaway cache cannot consume the node's ephemeral storage.
            - { name: tmp, mountPath: /tmp }
            - { name: kubecache, mountPath: /home/rollops/.kube }
          # /readyz is "process is up"; /livez is "still able to fork". The
          # v0.34.3 zombie leak left readiness green while every reconcile
          # failed with cannot-fork — liveness must catch that. Both are
          # unauthenticated; the listener is HTTPS so probe over TLS.
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: https, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
            # Give a wedged daemon a couple of failures before restart so a
            # brief reconcile burst near the headroom does not flap.
            failureThreshold: 3
          # Measured 2026-08-10 on a 2-node edge cluster: 268m steady, 330m
          # peak over 5m windows, 104Mi memory — against requests of 50m/64Mi
          # and a 500m CPU limit. Both numbers were wrong in the same direction.
          #
          # The request understated real use by 5x, so the scheduler packed the
          # node as if rollopsd were idle. The limit then throttled it 70% of
          # every CFS period: reconciles are bursty, and short spikes blow
          # through 500m even while the 5m average sits below it. A throttled
          # reconciler is slow to notice a new image, which is the one thing
          # this process exists to do.
          #
          # Requests now track observed steady state; the CPU limit is ~4.5x the
          # observed peak, which is headroom for the burst rather than a target.
          # If throttling persists, the next step is dropping the CPU limit
          # entirely — CFS throttling costs a latency-sensitive controller more
          # than the limit protects the node.
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: 1500m, memory: 384Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rollopsd-data }
        - name: watch
          configMap: { name: rollopsd-watch }
        - name: tls
          secret: { secretName: rollopsd-tls }
        - name: git
          secret: { secretName: rollopsd-git, optional: true }
        # Scratch for a read-only root filesystem. Both are caches rebuilt on demand, so
        # emptyDir is right and losing them on restart costs one slower reconcile.
        # sizeLimit is set because an unbounded emptyDir is charged against the node's
        # ephemeral storage, and a cache that grows without one can evict the pod it belongs
        # to — a failure mode that reads as a mysterious eviction rather than a full disk.
        # Written in block style rather than the flow style used elsewhere in this file, and
        # without naming the scanner's pattern in this comment: the rule matches on the key
        # alone, so writing it in prose here produced a third finding pointing at a comment.
        - name: tmp
          emptyDir:
            # 2Gi, not 64Mi. /tmp/rollops-repos holds a git clone of every
            # watched repository — 11 of them, measured at 117Mi on the live
            # daemon, already ~2x the old ceiling. Under a read-only root
            # filesystem that ceiling is enforced, so the pod was evicted and
            # rescheduled every ~30s in a loop that nothing else reported: the
            # deployment stayed "successfully rolled out" throughout, because a
            # replacement was always coming up.
            #
            # Still bounded, which is the point of the limit — this caps a
            # runaway cache well below the node's ephemeral storage while
            # leaving room for the clones to grow and for repos to be added.
            sizeLimit: 2Gi
        - name: kubecache
          emptyDir:
            sizeLimit: 64Mi
