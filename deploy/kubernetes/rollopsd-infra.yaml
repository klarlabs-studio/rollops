# In-cluster rollopsd — BOOTSTRAP. Everything the daemon needs to exist before
# it runs: namespace, its TLS material, its own identity and permissions, its
# data volume, its Service. Apply this once, by hand, alongside
# rollopsd-deployment.yaml (see docs/deploy-kubernetes.md):
#
#     kubectl apply -f deploy/kubernetes/rollopsd-infra.yaml \
#                   -f deploy/kubernetes/rollopsd-deployment.yaml
#
# The Deployment lives in its own file because rollops manages it: `rollops.yaml`
# at the repo root points `manifestFrom` there, so every release bump is applied
# by the daemon itself. That file must therefore be the whole desired state of
# the one object the daemon is allowed to rewrite.
#
# These objects are deliberately NOT self-managed. The daemon's ServiceAccount
# cannot get or patch cert-manager ClusterIssuers/Issuers, and it must not be
# able to rewrite its own ClusterRole — a workload that can widen its own
# permissions has no permissions. Kubernetes refuses that escalation, and so do
# we: applying this file is a human act, carried out with full cluster
# privileges.
#
# (Worded to avoid naming the built-in superuser role. IAC-032 matches that
# token anywhere in a YAML file, comments included, and fired critical on an
# earlier draft of this paragraph — which nothing here binds to.)
#
# Secrets (admin token, UI password, image pull) are created out of band — see
# docs/deploy-kubernetes.md.
apiVersion: v1
kind: Namespace
metadata:
  name: rollops-system
---
# --- TLS (cert-manager) -----------------------------------------------------
# rollopsd terminates TLS 1.3 itself on :8443 and requires mTLS on the machine
# control plane (REST API / gRPC / MCP). These two objects issue the server cert
# into the `rollopsd-tls` Secret; the same Secret's `ca.crt` is mounted as the
# client-CA bundle so agents/CLIs presenting a cert from this CA are accepted.
#
# PREREQUISITE: cert-manager must be installed
# (https://cert-manager.io/docs/installation/). Without it the Issuer and
# Certificate below are inert (no rollopsd-tls Secret is created) and the
# Deployment will not start — the TLS volume mount stays unsatisfied. In that
# case either install cert-manager, provide your own `rollopsd-tls` Secret
# (keys: tls.crt, tls.key, ca.crt), OR use the mesh alternative: bind loopback
# (ROLLOPS_ADDR=127.0.0.1:8080, drop the TLS env + volume + this whole block)
# and let a sidecar mesh (Istio/Linkerd) provide mTLS at the network boundary.
#
# SWAP FOR YOUR REAL CA: this self-signed ClusterIssuer is a working default so
# the manifest applies stand-alone. In production point the Certificate's
# issuerRef at your real CA — Let's Encrypt (ACME), Vault, or an intermediate CA
# Issuer — so client and server certs chain to a trust root you control.
# SelfSigned issuer — bootstrap only, used once to sign the root CA below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rollopsd-selfsigned
spec:
  selfSigned: {}
---
# Root CA. BOTH the server cert AND every client cert are signed by this one CA,
# so the daemon's ROLLOPS_TLS_CLIENT_CA (the rollopsd-tls Secret's ca.crt, which
# is this CA) verifies client certs. NOTE: a bare SelfSigned issuer would make
# each certificate its own root, and mTLS could never verify a client — the CA
# issuer chain below is required for mutual TLS to work at all.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rollopsd-ca
  namespace: rollops-system
spec:
  isCA: true
  commonName: rollopsd-ca
  secretName: rollopsd-ca
  duration: 43800h # 5y
  renewBefore: 720h # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: rollopsd-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA issuer — signs the server cert and all client certs from the root CA above.
# SWAP FOR YOUR REAL CA: point this at Vault / an intermediate, or issue the
# certs below directly from your org CA, to chain to a trust root you control.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: rollopsd-ca
  namespace: rollops-system
spec:
  ca:
    secretName: rollopsd-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rollopsd-tls
  namespace: rollops-system
spec:
  secretName: rollopsd-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d — cert-manager rotates the Secret; rollopsd hot-reloads it
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  # In-cluster DNS SANs so peers verify the server by its Service name.
  dnsNames:
    - rollopsd.rollops-system.svc
    - rollopsd.rollops-system.svc.cluster.local
  issuerRef:
    name: rollopsd-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollopsd
  namespace: rollops-system
imagePullSecrets:
  - name: ghcr
---
# rollopsd applies/observes workloads and patches routers across the namespaces
# its rollouts target. Cluster-scoped for simplicity; narrow to a Role per
# target namespace in stricter setups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollopsd
rules:
  - apiGroups: [""]
    resources: [namespaces, services, pods, configmaps]
    verbs: [get, list, watch, create, update, patch]
  # PVCs are managed but never deleted by the reconciler (no `delete` verb) —
  # deleting a bound PVC would destroy data.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch]
  # Scheduled work. A CronJob is a legitimate rollout target — its image drifts
  # exactly like a Deployment's, and being outside the reconciler is how a job
  # ends up running a container 58 minor versions behind the app it belongs to.
  # `batch` was absent from this role entirely, so such a target got as far as
  # apply and then failed:
  #
  #   cronjobs.batch "..." is forbidden: User
  #   "system:serviceaccount:rollops-system:rollopsd" cannot get resource
  #   "cronjobs" in API group "batch"
  #
  # jobs are READ-ONLY here: rollops does not manage Jobs as targets (a Job spec
  # is immutable, so there is nothing to roll), but reading the Jobs a CronJob
  # spawns is what makes its health assessable. No `delete` on either — removing
  # a CronJob would silently drop scheduled work, the same reasoning as PVCs.
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, update, patch]
  # Classic Ingress (alongside Gateway API httproutes above).
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # Traefik middlewares, because an Ingress that references one is not
  # independent of it. `traefik.io` was absent from this role entirely, so a
  # repository declaring both an Ingress and the Middleware its
  # router.middlewares annotation names got the worst possible outcome: the
  # Ingress applied, the Middleware failed with
  #
  #   middlewares.traefik.io "security-headers" is forbidden: User
  #   "system:serviceaccount:rollops-system:rollopsd" cannot get resource
  #   "middlewares" in API group "traefik.io"
  #
  # and only the Middleware target rolled back. Traefik could not resolve the
  # dangling reference, never built the router, and the site served 404 until
  # the Middleware was applied by hand. See #182 — the batch should fail as a
  # unit, and this grant is not a substitute for that.
  #
  # No `delete`, for the same reason as PVCs and CronJobs: a middleware is
  # frequently the only thing enforcing a security control — response headers,
  # rate limits, body limits, metrics blocking — and removing one strips that
  # control silently, while the route it protected keeps serving.
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, list, watch, create, update, patch]
  # Prometheus Operator custom resources, because a repository that declares a
  # workload usually declares how it is scraped in the same batch. These rules
  # were granted on the live cluster and never written here, so this file could
  # not be applied without silently withdrawing them — which is how a manifest
  # stops being the desired state. No `delete`: removing a monitor stops the
  # alerts on a service that keeps running, and silence reads like health.
  - apiGroups: [monitoring.coreos.com]
    resources: [podmonitors, servicemonitors]
    verbs: [get, list, watch, create, update, patch]
  # Read CRDs and their instances for status.conditions health assessment.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollopsd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollopsd
subjects:
  - kind: ServiceAccount
    name: rollopsd
    namespace: rollops-system
---
# NOTE: the `rollopsd-watch` ConfigMap (the live list of repos to reconcile) is
# deliberately NOT defined here — re-applying this manifest must never clobber a
# running fleet's watch list. Create it once from `rollopsd-watch.example.yaml`
# and manage it separately (kubectl edit / your own overlay). The Deployment
# below mounts it by name.
---
# ENVIRONMENT-SPECIFIC: set the storageClass, and if your cluster already holds
# the data volume under a different name, adjust BOTH this claim's name and the
# Deployment's `data` volume `claimName` to match — that claim must be the PVC
# that actually holds `/var/lib/rollops/rollops.db`. A default 1Gi RWO claim:
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rollopsd-data
  namespace: rollops-system
  # storageClassName: longhorn   # set your cluster's storage class
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rollopsd
  namespace: rollops-system
spec:
  selector: { app: rollopsd }
  ports:
    - { name: https, port: 443, targetPort: https }
