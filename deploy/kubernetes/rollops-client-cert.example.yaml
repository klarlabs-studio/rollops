# Client certificate for a machine caller (CLI, agent, or CI) of the rollopsd
# control plane. With mTLS enabled (ROLLOPS_TLS_CLIENT_CA set on the daemon),
# the REST API, gRPC, and MCP surfaces REQUIRE a client cert signed by the same
# CA as the server — this issues one from the `rollopsd-ca` Issuer created in
# rollopsd.yaml, so it chains to the CA the daemon trusts.
#
# Copy this per caller, giving each a distinct name/commonName so certs can be
# rotated or revoked independently. commonName becomes the caller's cert identity
# (surfaced in logs); it is NOT the RBAC identity — that still comes from the
# bearer token / OIDC presented over the mTLS channel.
#
# Apply, then extract the keypair for a caller that runs OUTSIDE the cluster
# (a laptop CLI or a CI runner):
#
#   kubectl -n rollops-system apply -f rollops-client-cert.example.yaml
#   kubectl -n rollops-system get secret rollopsd-client-cli \
#     -o jsonpath='{.data.tls\.crt}' | base64 -d > client.crt
#   kubectl -n rollops-system get secret rollopsd-client-cli \
#     -o jsonpath='{.data.tls\.key}' | base64 -d > client.key
#   kubectl -n rollops-system get secret rollopsd-client-cli \
#     -o jsonpath='{.data.ca\.crt}'  | base64 -d > ca.crt
#
# Then point the caller at them, e.g.:
#   grpcurl -cert client.crt -key client.key -cacert ca.crt rollopsd:8443 ...
#   curl --cert client.crt --key client.key --cacert ca.crt https://rollopsd:8443/v1/status
# See docs/tls.md for the CLI/agent env wiring.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rollopsd-client-cli
  namespace: rollops-system
spec:
  secretName: rollopsd-client-cli
  commonName: cli # the caller's cert identity — one per caller
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
  issuerRef:
    name: rollopsd-ca
    kind: Issuer
    group: cert-manager.io
